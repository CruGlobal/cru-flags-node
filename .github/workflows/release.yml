name: release

# Fires when a GitHub Release is published. release-please (on main)
# is the intended source: when its release PR is merged, release-please
# creates a matching GitHub Release and this workflow picks it up.
# Manual releases created through the UI / gh CLI work too, and
# workflow_dispatch is available for retrying a failed publish.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One release workflow at a time. npm publishes are a single-writer
# operation; serialize to avoid races.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance and for npm trusted publishing (OIDC).
      # Without it, `npm publish --provenance` fails at upload time.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Sanity: re-run the full check suite against the exact commit
      # being published. release-please's PR was already green before
      # merge, but releases can also be cut manually, and the 30-second
      # cost buys us protection against that.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: this repo publishes via npm trusted
      # publishing (OIDC), configured on the npm package after the
      # initial manual 0.1.0 bootstrap publish. If this step fails with
      # ENEEDAUTH, the trusted publisher has not been attached yet.
      - name: Publish to npm
        run: npm publish --provenance --access public
